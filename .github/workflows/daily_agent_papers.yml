#weijinzi
# 用途：每 45 天自动抓取多渠道 AI 论文（arXiv 窗口 / 三大顶会 / Nature 系）并评分、建索引。
# 前因：原每日 workflow 只抓当天 arXiv 新论文，引用信号全为 0，且用户不需要每日频率。
# 原因：GitHub Actions cron 不支持"每 45 天"周期，故每日触发 + 45 天门控（幂等、自愈、可手动）。
# 内容：门控通过后依次运行 crawl_arxiv_window / crawl_top_conferences / crawl_nature，
#       再跑 paper_quality_filter 评分归档与 dedupe_and_categorize 重建统一索引。
# 行为：门控规则 = 距上次抓取提交 ≥45 天，或手动 workflow_dispatch 触发；
#       三大顶会以 Semantic Scholar 为主渠道，OpenReview 仅可选补充且失败不阻塞；
#       主抓取失败仍中止，避免半截数据被提交。
# 存储：结果写入 agent_and_harness/、combinatorial_optimization/、NeurIPS|ICML|ICLR/、Nature/、_index/。
# 提交：有变更才提交推送，提交信息带运行日期，作者为 github-actions bot。
# 依赖：actions/checkout + 内置 Python 3.11 + requests + beautifulsoup4。
# 触发：每日 cron 尝试（内部门控）+ workflow_dispatch 强制运行。
# ---

name: AI Papers Digest (45d)

on:
  schedule:
    - cron: "0 1 * * *"   # 每日尝试，是否真跑由 45 天门控决定
  workflow_dispatch: {}   # 手动触发 = 强制运行

permissions:
  contents: write

concurrency:
  group: papers-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for gating)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate (45-day interval)
        id: gate
        env:
          DATA_PATHS: "agent_and_harness combinatorial_optimization Nature NeurIPS ICML ICLR"
        run: |
          LAST_TS=$(git log -1 --format=%ct -- $DATA_PATHS 2>/dev/null || echo 0)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST_TS) / 86400 ))
          echo "距上次抓取 ${AGE_DAYS} 天"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || $AGE_DAYS -ge 45 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests beautifulsoup4

      - name: Crawl arXiv 18-month window
        if: steps.gate.outputs.run == 'true'
        run: python code/crawl_arxiv_window.py

      - name: Crawl NeurIPS/ICML/ICLR via Semantic Scholar
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python code/crawl_top_conferences.py

      - name: Crawl Nature & NMI via Crossref
        if: steps.gate.outputs.run == 'true'
        run: python code/crawl_nature.py

      - name: Quality filter
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python code/paper_quality_filter.py --agent-dir agent_and_harness

      - name: Rebuild index
        if: steps.gate.outputs.run == 'true'
        run: python code/dedupe_and_categorize.py --root . --output _index

      - name: Commit & push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent_and_harness combinatorial_optimization NeurIPS ICML ICLR Nature _index
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 45天论文抓取流水线 ($(date -u +%F))"
            git push
          fi
